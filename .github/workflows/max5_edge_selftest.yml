name: MAX5 Edge Selftest

on:
  push:
    paths:
      - '.github/workflows/max5_edge_selftest.yml'
  pull_request:
    paths:
      - 'tmp/MAX5_EDGE_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact five Juancito contracts
        shell: bash
        run: |
          set -euo pipefail
          URL='https://lrgixxftugjokmymntxz.supabase.co/functions/v1/max5-today-football-v3-live?action=selftest_ticket'
          curl --fail --silent --show-error --max-time 30 "$URL" | tee /tmp/max5.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/max5.json'))
          assert d.get('ok') is True, d
          assert d.get('postgres_required') is False, d
          assert d.get('all_available') is True, d
          rs=d.get('results') or []
          assert len(rs)==5, d
          for r in rs:
              assert r.get('available') is True, r
              assert r.get('contract')=='FULL_GAME_TEAM_TOTAL_UNDER', r
              assert str(r.get('condition_type','')).lower()=='under', r
              print(r.get('home'),'vs',r.get('away'),'|',r.get('participant'),'|',r.get('side'),'U',r.get('selected_line'),'|',r.get('decimal_odds'),'|',r.get('verified_at'))
          print('MAX5_EXACT5_CONTRACTS_LIVE_OK')
          PY
